[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is transitive through image/rav1e/simba; informational advisory, no vulnerability and no safe upgrade" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is transitive through oar-ocr/imageproc; informational advisory, no vulnerability and no safe upgrade" },
  { id = "RUSTSEC-2025-0081", reason = "rust-unic is transitive through urlpattern/Tauri; informational advisory, no vulnerability and no safe upgrade" },
  { id = "RUSTSEC-2025-0075", reason = "rust-unic is transitive through urlpattern/Tauri; informational advisory, no vulnerability and no safe upgrade" },
  { id = "RUSTSEC-2025-0080", reason = "rust-unic is transitive through urlpattern/Tauri; informational advisory, no vulnerability and no safe upgrade" },
  { id = "RUSTSEC-2025-0100", reason = "rust-unic is transitive through urlpattern/Tauri; informational advisory, no vulnerability and no safe upgrade" },
  { id = "RUSTSEC-2025-0098", reason = "rust-unic is transitive through urlpattern/Tauri; informational advisory, no vulnerability and no safe upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Pinned upstream notify-rust hotfix removes vulnerable quick-xml from the Windows graph.
allow-git = ["https://github.com/hoodie/notify-rust"]

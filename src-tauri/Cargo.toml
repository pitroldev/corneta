[package]
name = "corneta"
version = "0.1.0"
description = "Corneta — transmita para todas as plataformas ao mesmo tempo."
authors = ["Pitrol"]
edition = "2021"
rust-version = "1.77"

[lib]
# O nome do lib é referenciado por main.rs como `corneta_lib::run()`.
name = "corneta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
# Atalhos globais, notificações nativas e memória de tamanho/posição da janela.
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
# Diálogos nativos (confirmar saída, importar/exportar config).
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cliente HTTP leve (bloqueante) para o teste de upload — rodado em spawn_blocking.
ureq = "2"
# Uso de CPU ao vivo (GPU via nvidia-smi). Só o módulo "system".
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# WebSocket para obs-websocket v5 (ws://) e chat da Twitch/Kick (Kick/Pusher é wss:// → TLS).
tungstenite = { version = "0.23", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
sha2 = "0.10"
base64 = "0.22"
# Regras do guardião anti-vazamento (email/chave/CPF/cartão/JWT no texto do OCR).
regex = "1"
# windows-native ativa o Credential Manager (sem feature, o keyring v3 vira no-op em memória).
# Para macOS/Linux depois: features = ["apple-native"] / ["sync-secret-service"].
keyring = { version = "3", features = ["windows-native"] }

# OCR local do guardião anti-vazamento via Windows.Media.Ocr (nativo, sem binário extra).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

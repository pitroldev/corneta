[package]
name = "corneta"
version = "0.8.1"
description = "Corneta — stream to all your platforms at once."
authors = ["Pitrol"]
edition = "2021"
license = "MIT"
publish = false
# Keep the minimum compiler aligned with the pinned release toolchain.
rust-version = "1.97.1"

[lib]
name = "corneta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Asset access starts empty; commands::record_allow_file grants individual recordings.
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-log = "2.9.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-dialog = "2.7.2"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The SDK worker delivers events without making client creation/flush depend on Tokio.
posthog-rs = { version = "=0.21.0", default-features = false, features = ["error-tracking"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ureq3 = { package = "ureq", version = "3.3.0" }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
sha2 = "0.11.0"
base64 = "0.23.0"
# Share immutable decoded frames across delay, freeze and encoding without large copies.
bytes = "1.12.1"
getrandom = "0.4.3"
regex = "1.13.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# CPU OCR avoids GPU contention with video codecs and a DirectML runtime dependency.
# OAR-OCR 0.8.1 requires the execution-provider API removed in ort RC 13.
oar-ocr = "0.8.1"
ort = "=2.0.0-rc.13"
# Other operating systems need an explicitly configured and validated credential provider.
keyring = { version = "4.1.6", default-features = false, features = ["v1", "windows-native-keyring-store"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1.53.1", features = ["net", "sync", "macros", "time"] }
tauri-plugin-updater = "2.10.1"

# Security backport: notify-rust 4.18 pins a vulnerable quick-xml through winrt-notification.
# Remove this upstream commit pin when a release includes winrt-notification 0.8.1.
[patch.crates-io]
notify-rust = { git = "https://github.com/hoodie/notify-rust", rev = "a733009b2c52c6605443b287ae5348a6c4879a3e" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Performance"] }
# Keep COM bindings aligned with Wry; mixing versions produces incompatible interfaces.
webview2-com = "=0.38.2"

[dev-dependencies]
# Match the updater's signature verifier.
minisign-verify = "=0.2.5"

[profile.release]
# Isolate worker panics and allow buffered session writers to flush during unwinding.
panic = "unwind"
codegen-units = 1
lto = true
# Favor video/OCR throughput; LTO and stripping limit binary size.
opt-level = 3
strip = true

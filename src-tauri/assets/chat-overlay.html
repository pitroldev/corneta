<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corneta · Overlay de chat</title>
    <style>
      :root {
        --brass: #ffb323;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Baloo 2", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #feed {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 20px;
        overflow: hidden;
      }
      body[data-pos="bottom"] #feed {
        justify-content: flex-end;
      }
      body[data-pos="top"] #feed {
        justify-content: flex-start;
      }

      .msg {
        width: fit-content;
        max-width: 100%;
        padding: 6px 12px;
        background: rgba(14, 11, 6, 0.72);
        border-radius: 12px;
        line-height: 1.35;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        overflow-wrap: anywhere;
        animation: pop 0.28s cubic-bezier(0.18, 0.9, 0.28, 1.2) both;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .msg {
          animation: none;
        }
      }

      .msg .dot {
        display: inline-block;
        width: 0.55em;
        height: 0.55em;
        border-radius: 999px;
        margin-right: 0.4em;
        vertical-align: 0.05em;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35);
      }
      .msg .badge {
        display: inline-block;
        margin-right: 0.35em;
        padding: 0 0.4em;
        border-radius: 5px;
        font-size: 0.62em;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        vertical-align: 0.15em;
      }
      .msg .author {
        font-weight: 800;
      }
      .msg .author::after {
        content: ":";
        color: rgba(255, 255, 255, 0.55);
        font-weight: 700;
      }
      .msg .body {
        margin-left: 0.35em;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.95);
      }
      .msg .emote {
        height: 1.5em;
        width: auto;
        vertical-align: -0.4em;
        margin: 0 1px;
      }
      .msg .emote.giant {
        height: 4em;
      }
      .msg .stack {
        display: inline-grid;
        vertical-align: -0.4em;
      }
      .msg .stack > img {
        grid-area: 1 / 1;
        margin: auto;
        vertical-align: 0;
      }
      .msg .gif {
        max-height: 6em;
        max-width: 100%;
        border-radius: 8px;
        vertical-align: middle;
      }
      .msg .cheer {
        font-weight: 800;
      }
      .msg .mention {
        font-weight: 800;
      }
      .msg img.badge {
        height: 1em;
        width: auto;
        padding: 0;
        vertical-align: -0.12em;
      }
      .msg.hl {
        border-left: 4px solid var(--hl, #ffb323);
      }
      .msg .reply {
        display: block;
        font-size: 0.72em;
        opacity: 0.75;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .msg.action .body {
        font-style: italic;
      }
      .msg.system .body {
        margin-left: 0;
        font-style: italic;
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="feed"></div>
    <script>
      (() => {
        "use strict";
        const q = new URLSearchParams(location.search);
        const POS = q.get("pos") === "top" ? "top" : "bottom";
        const SIZE = Math.max(
          10,
          Math.min(48, parseInt(q.get("size") || "22", 10) || 22),
        );
        const MAX = Math.max(
          1,
          Math.min(40, parseInt(q.get("max") || "12", 10) || 12),
        );
        const SHOW_BADGES = q.get("badges") !== "0";
        const SHOW_PLATFORM = q.get("platform") !== "0";
        const NOCMD = q.get("nocmd") === "1";
        const FADE =
          Math.max(0, Math.min(600, parseInt(q.get("fade") || "0", 10) || 0)) *
          1000;
        const DEMO = q.get("demo") === "1";

        document.body.dataset.pos = POS;
        const feed = document.getElementById("feed");
        feed.style.fontSize = SIZE + "px";

        const PLAT_COLOR = {
          twitch: "#a970ff",
          youtube: "#ff4e45",
          kick: "#53fc18",
          cinefy: "#ffd200",
        };
        const BADGE_COLOR = {
          broadcaster: "#ff5a3c",
          moderator: "#22c55e",
          vip: "#e879f9",
          subscriber: "#ffb323",
          staff: "#7c9cff",
          partner: "#7c9cff",
        };
        function badgeStyle(kind) {
          const bg = BADGE_COLOR[kind] || "#4a4136";
          const ink = kind === "subscriber" ? "#2a1c00" : "#fff";
          return `background:${bg};color:${ink}`;
        }
        function esc(s) {
          return String(s).replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
        }
        function fragHtml(f) {
          const alt = esc(f.text || "");
          if (f.kind === "emote" && f.url)
            return `<img class="emote${f.giant ? " giant" : ""}" src="${esc(f.url)}" alt="${alt}" />`;
          if ((f.kind === "gif" || f.kind === "sticker") && f.url)
            return `<img class="gif" src="${esc(f.url)}" alt="${alt}" />`;
          if (f.kind === "cheer")
            return f.url
              ? `<span class="cheer"${f.color ? ` style="color:${esc(f.color)}"` : ""}><img class="emote" src="${esc(f.url)}" alt="${alt}" />${esc(f.amount ?? "")}</span>`
              : `<span class="cheer">${alt}</span>`;
          if (f.kind === "mention")
            return `<span class="mention">${alt}</span>`;
          return alt;
        }
        // Zero-width emotes stack over the emote before them.
        function fragsHtml(m) {
          const frags =
            Array.isArray(m.fragments) && m.fragments.length
              ? m.fragments
              : [{ kind: "text", text: m.text || "" }];
          let html = "";
          for (let i = 0; i < frags.length; i++) {
            const stack = [frags[i]];
            while (
              frags[i].kind === "emote" &&
              frags[i + 1] &&
              frags[i + 1].overlay
            )
              stack.push(frags[++i]);
            html +=
              stack.length > 1
                ? `<span class="stack">${stack.map(fragHtml).join("")}</span>`
                : fragHtml(stack[0]);
          }
          return html;
        }
        const HL_COLOR = {
          first: "#3ccf8e",
          returning: "#5aa7ff",
          highlighted: "#bd73ff",
          redeemed: "#ffb323",
          announcement: "#9146ff",
          effect: "#ff7ad9",
          pinned: "#ffb323",
          celebration: "#53fc18",
        };
        // Moderation removes lines already on screen; data-* carry what a deletion matches.
        function removeMatching(d) {
          if (!d) return;
          for (const el of Array.from(feed.children)) {
            const x = el.dataset;
            if (x.platform !== d.platform) continue;
            if (d.source != null && x.source !== d.source) continue;
            const hit =
              d.scope === "message"
                ? !!d.nativeId && x.nativeId === d.nativeId
                : d.scope === "user"
                  ? d.authorId && x.authorId
                    ? x.authorId === d.authorId
                    : !!d.author &&
                      (x.author || "").toLowerCase() === d.author.toLowerCase()
                  : d.scope === "all";
            if (hit) el.remove();
          }
        }

        function render(m) {
          if (!m || m.deleted) return;
          if (NOCMD && (m.text || "").trim().startsWith("!")) return;
          const el = document.createElement("div");
          el.className =
            "msg" +
            (m.highlight && !m.system ? " hl" : "") +
            (m.action ? " action" : "") +
            (m.system ? " system" : "");
          const hl = m.accent || HL_COLOR[m.highlight];
          if (hl) el.style.setProperty("--hl", hl);
          el.dataset.platform = m.platform || "";
          el.dataset.source = m.source || "";
          el.dataset.author = m.author || "";
          if (m.nativeId) el.dataset.nativeId = m.nativeId;
          if (m.authorId) el.dataset.authorId = m.authorId;
          const dot = SHOW_PLATFORM
            ? `<span class="dot" style="background:${PLAT_COLOR[m.platform] || "#999"}"></span>`
            : "";
          const badges =
            SHOW_BADGES && Array.isArray(m.badges)
              ? m.badges
                  .map((b) =>
                    b.url
                      ? `<img class="badge" src="${esc(b.url)}" alt="${esc(b.title || b.label || "")}" />`
                      : b.label
                        ? `<span class="badge" style="${badgeStyle(b.kind)}">${esc(b.label)}</span>`
                        : "",
                  )
                  .join("")
              : "";
          const authorColor = m.color
            ? `color:${esc(m.color)}`
            : "color:var(--brass)";
          const reply = m.reply
            ? `<span class="reply">↳ ${esc(m.reply.author || "")}: ${esc(m.reply.text || "")}</span>`
            : "";
          const bodyColor =
            m.action && m.color ? ` style="color:${esc(m.color)}"` : "";
          el.innerHTML = m.system
            ? dot + `<span class="body">${fragsHtml(m)}</span>`
            : reply +
              dot +
              badges +
              `<span class="author" style="${authorColor}">${esc(m.author || "")}</span>` +
              `<span class="body"${bodyColor}>${fragsHtml(m)}</span>`;
          feed.appendChild(el);
          while (feed.childElementCount > MAX)
            feed.removeChild(feed.firstElementChild);
          if (FADE > 0) {
            setTimeout(() => {
              el.style.transition = "opacity 0.5s ease";
              el.style.opacity = "0";
              setTimeout(() => el.remove(), 500);
            }, FADE);
          }
        }

        let ws = null,
          retry = 0,
          alive = true;
        function connect() {
          try {
            ws = new WebSocket(`ws://${location.host}/chat-ws`);
          } catch (_) {
            return;
          }
          ws.onopen = () => {
            retry = 0;
          };
          ws.onmessage = (ev) => {
            let m;
            try {
              m = JSON.parse(ev.data);
            } catch (_) {
              return;
            }
            if (m && m.event === "delete") return removeMatching(m.data);
            if (m && m.event) return;
            render(m);
          };
          ws.onclose = () => {
            if (!alive) return;
            retry = Math.min(retry + 1, 6);
            setTimeout(connect, 400 * retry);
          };
          ws.onerror = () => {
            try {
              ws.close();
            } catch (_) {}
          };
        }
        window.addEventListener("beforeunload", () => {
          alive = false;
          try {
            ws && ws.close();
          } catch (_) {}
        });
        connect();

        if (DEMO) {
          const samples = [
            {
              platform: "twitch",
              author: "joao_gamer",
              color: "#ff7f50",
              badges: [{ label: "sub", kind: "subscriber" }],
              text: "salve galera!",
              fragments: [
                { kind: "text", text: "salve galera! " },
                {
                  kind: "emote",
                  text: "Kappa",
                  url: "https://static-cdn.jtvnw.net/emoticons/v2/25/default/dark/2.0",
                },
              ],
            },
            {
              platform: "kick",
              author: "maria",
              color: "#53fc18",
              badges: [],
              fragments: [{ kind: "text", text: "esse clutch foi surreal 🔥" }],
            },
            {
              platform: "youtube",
              author: "ana",
              color: "#ff4e45",
              badges: [{ label: "membro", kind: "vip" }],
              fragments: [
                { kind: "text", text: "primeira vez na live, curtindo demais" },
              ],
            },
            {
              platform: "twitch",
              author: "mod_do_canal",
              color: "#22c55e",
              badges: [{ label: "mod", kind: "moderator" }],
              fragments: [{ kind: "text", text: "bora cornetar!" }],
            },
          ];
          let i = 0;
          setInterval(() => render(samples[i++ % samples.length]), 2200);
        }
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corneta · Alerts overlay</title>
    <style>
      :root {
        --brass: #ffb323;
        --ink: #fff;
        --card: rgba(14, 11, 6, 0.82);
        --accent: var(--brass);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Baloo 2", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 48px;
        gap: 14px;
        pointer-events: none;
      }
      body[data-pos^="top"] #stage {
        justify-content: flex-start;
      }
      body[data-pos^="bottom"] #stage {
        justify-content: flex-end;
      }
      body[data-pos="center"] #stage {
        justify-content: center;
      }
      body[data-pos$="left"] #stage {
        align-items: flex-start;
      }
      body[data-pos$="right"] #stage {
        align-items: flex-end;
      }
      body[data-pos="top"] #stage,
      body[data-pos="bottom"] #stage,
      body[data-pos="center"] #stage {
        align-items: center;
      }

      /* em units let the stage font size scale the entire card. */
      .alert {
        display: flex;
        align-items: center;
        gap: 1em;
        max-width: min(560px, 80vw);
        padding: 1em 1.375em 1em 1.125em;
        background: var(--card);
        border-left: 0.375em solid var(--accent);
        border-radius: 0.875em;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.06) inset;
        backdrop-filter: blur(3px);
        opacity: 0;
        transform: translateY(var(--slide, -22px)) scale(0.96);
        transition:
          opacity 0.32s ease,
          transform 0.42s cubic-bezier(0.18, 0.9, 0.28, 1.2);
      }
      body[data-pos^="bottom"] .alert {
        --slide: 22px;
      }
      .alert.in {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .alert .emoji {
        font-size: 2.5em;
        line-height: 1;
        filter: drop-shadow(
          0 0 10px color-mix(in srgb, var(--accent) 55%, transparent)
        );
        flex-shrink: 0;
      }
      .alert .body {
        min-width: 0;
      }
      .alert .head {
        color: var(--ink);
        font-weight: 800;
        font-size: 1.375em;
        line-height: 1.15;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        overflow-wrap: anywhere;
      }
      .alert .head b {
        color: var(--accent);
      }
      .alert .msg {
        margin-top: 0.25em;
        color: rgba(255, 255, 255, 0.82);
        font-weight: 600;
        font-size: 0.9375em;
        line-height: 1.25;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .alert .msg .emote {
        height: 1.4em;
        width: auto;
        vertical-align: -0.35em;
        margin: 0 1px;
      }
      .alert .art {
        display: block;
        max-height: 5em;
        width: auto;
        margin-top: 0.3em;
        border-radius: 8px;
      }
      .alert .plat {
        margin-top: 0.375em;
        font-size: 0.6875em;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: color-mix(in srgb, var(--accent) 80%, #fff 20%);
        opacity: 0.85;
      }
      @media (prefers-reduced-motion: reduce) {
        .alert {
          transition: opacity 0.2s ease;
          transform: none;
        }
        .alert.in {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      (() => {
        "use strict";
        const q = new URLSearchParams(location.search);
        const SOUND = q.get("sound") !== "0";
        const POS = q.get("pos") || "top";
        const DUR =
          Math.max(2, Math.min(30, parseInt(q.get("dur") || "6", 10) || 6)) *
          1000;
        const SCALE = { sm: 0.8, md: 1, lg: 1.25 }[q.get("scale")] || 1;
        const FOLLOWS = q.get("follows") !== "0";
        const DEMO = q.get("demo") === "1";

        document.body.dataset.pos = POS;
        const stage = document.getElementById("stage");
        stage.style.fontSize = 16 * SCALE + "px";

        const ACCENT = {
          green: "#34d399",
          brass: "#ffb323",
          blue: "#5eb0ef",
          tomato: "#ff5a3c",
          cyan: "#3ad1c8",
        };
        // The local server sets <html lang> from the app's language when it serves this page.
        const EN = document.documentElement.lang !== "pt-BR";
        const TEXT = EN
          ? {
              someone: "someone",
              follow: (U) => `${U} followed the channel!`,
              sub: (U) => `${U} subscribed!`,
              resub: (U) => `${U} subscribed again!`,
              months: (n) => `${n} months in a row`,
              subgift: (U, n, many) =>
                `${U} gifted ${n} ${many ? "subs" : "sub"}!`,
              bits: (U, n) => `${U} sent ${n} bits!`,
              tip: (U, m) => `${U} tipped ${m}!`,
              raid: (U, n) => `${U} raided with ${n || "the whole crew"}!`,
              member: (U) => `${U} became a member!`,
              superchat: (U, m) => `${U} — super chat ${m}`,
              upgrade: (U) => `${U} kept their gifted sub going!`,
              payforward: (U) => `${U} paid the gift forward!`,
              streak: (U, n) =>
                `${U} has been here ${n || "several"} streams in a row!`,
              charity: (U, m) => `${U} donated ${m} to charity!`,
              gift: (U, what) => `${U} sent ${what || "a gift"}!`,
              kicks: (U, n) => `${U} sent ${n} KICKs!`,
              reward: (U, what) => `${U} redeemed ${what || "a reward"}!`,
              milestone: (U) => `${U} hit a milestone!`,
            }
          : {
              someone: "alguém",
              follow: (U) => `${U} seguiu o canal!`,
              sub: (U) => `${U} assinou!`,
              resub: (U) => `${U} assinou de novo!`,
              months: (n) => `${n} meses seguidos`,
              subgift: (U, n, many) =>
                `${U} presenteou ${n} ${many ? "subs" : "sub"}!`,
              bits: (U, n) => `${U} mandou ${n} bits!`,
              tip: (U, m) => `${U} doou ${m}!`,
              raid: (U, n) => `${U} chegou com ${n || "a galera"} na raid!`,
              member: (U) => `${U} virou membro!`,
              superchat: (U, m) => `${U} — super chat ${m}`,
              upgrade: (U) => `${U} continuou a assinatura de presente!`,
              payforward: (U) => `${U} passou o presente adiante!`,
              streak: (U, n) =>
                `${U} tá há ${n || "várias"} lives seguidas aqui!`,
              charity: (U, m) => `${U} doou ${m} pra caridade!`,
              gift: (U, what) => `${U} mandou ${what || "um presente"}!`,
              kicks: (U, n) => `${U} mandou ${n} KICKs!`,
              reward: (U, what) => `${U} resgatou ${what || "uma recompensa"}!`,
              milestone: (U) => `${U} chegou a um marco!`,
            };
        function fmtAmount(n) {
          if (n == null || isNaN(n)) return "";
          if (Number.isInteger(n)) return String(n);
          return EN ? n.toFixed(2) : n.toFixed(2).replace(".", ",");
        }
        function money(a) {
          const cur = (raw.currency || "").toString().trim();
          const v = fmtAmount(a);
          return cur ? `${cur === "BRL" ? "R$" : cur} ${v}` : v;
        }
        // money() reads the currency from the alert currently being presented.
        let raw = {};
        function present(a) {
          raw = a || {};
          const user = (a.user || TEXT.someone).toString();
          const amt =
            typeof a.amount === "number" ? a.amount : Number(a.amount);
          const U = `<b>${esc(user)}</b>`;
          const title = a.title ? esc(a.title) : "";
          switch (a.kind) {
            case "follow":
              return { emoji: "🎉", head: TEXT.follow(U), accent: "green" };
            case "sub":
              return { emoji: "⭐", head: TEXT.sub(U), accent: "brass" };
            case "resub":
              return {
                emoji: "⭐",
                head: TEXT.resub(U),
                note: amt > 1 ? TEXT.months(fmtAmount(amt)) : "",
                accent: "brass",
              };
            case "subgift":
              return {
                emoji: "🎁",
                head: TEXT.subgift(U, fmtAmount(amt) || "1", amt > 1),
                accent: "brass",
              };
            case "bits":
              return {
                emoji: "💎",
                head: TEXT.bits(U, fmtAmount(amt)),
                accent: "cyan",
              };
            case "tip":
              return {
                emoji: "💰",
                head: TEXT.tip(U, money(amt)),
                accent: "green",
              };
            case "raid":
              return {
                emoji: "🚀",
                head: TEXT.raid(U, fmtAmount(amt)),
                accent: "tomato",
              };
            case "member":
              return { emoji: "🌟", head: TEXT.member(U), accent: "brass" };
            case "superchat":
              return {
                emoji: "💬",
                head: TEXT.superchat(U, money(amt)),
                note: a.image && a.title ? title : "",
                accent: "blue",
              };
            case "upgrade":
              return { emoji: "⏫", head: TEXT.upgrade(U), accent: "brass" };
            case "payforward":
              return {
                emoji: "🤝",
                head: TEXT.payforward(U),
                accent: "tomato",
              };
            case "streak":
              return {
                emoji: "🔥",
                head: TEXT.streak(U, fmtAmount(amt)),
                accent: "tomato",
              };
            case "charity":
              return {
                emoji: "💚",
                head: TEXT.charity(U, money(amt)),
                note: title,
                accent: "green",
              };
            case "gift":
              return {
                emoji: "🎀",
                head: TEXT.gift(U, title),
                accent: "brass",
              };
            case "kicks":
              return {
                emoji: "🟩",
                head: TEXT.kicks(U, fmtAmount(amt)),
                note: title,
                accent: "green",
              };
            case "reward":
              return {
                emoji: "🎟️",
                head: TEXT.reward(U, title),
                accent: "cyan",
              };
            case "milestone":
              return { emoji: "🏆", head: TEXT.milestone(U), accent: "brass" };
            default:
              return {
                emoji: "📣",
                head: U,
                note: a.kind || "",
                accent: "brass",
              };
          }
        }
        function esc(s) {
          return String(s).replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
        }
        function msgHtml(a) {
          if (Array.isArray(a.fragments) && a.fragments.length) {
            return a.fragments
              .map((f) =>
                (f.kind === "emote" || f.kind === "cheer") && f.url
                  ? `<img class="emote" src="${esc(f.url)}" alt="${esc(f.text || "")}" />`
                  : esc(f.text || ""),
              )
              .join("");
          }
          return a.message ? esc(a.message) : "";
        }

        const queue = [];
        let showing = false;
        function enqueue(a) {
          if (!a || typeof a !== "object" || !a.kind) return;
          if (!FOLLOWS && a.kind === "follow") return;
          queue.push(a);
          if (!showing) next();
        }
        function next() {
          const a = queue.shift();
          if (!a) {
            showing = false;
            return;
          }
          showing = true;
          render(a, () => setTimeout(next, 250));
        }
        function render(a, done) {
          const p = present(a);
          const el = document.createElement("div");
          el.className = "alert";
          el.style.setProperty("--accent", ACCENT[p.accent] || ACCENT.brass);
          const platLabel = (a.platform || "").toString();
          const msg = msgHtml(a) || p.note || "";
          el.innerHTML =
            `<div class="emoji">${p.emoji}</div>` +
            `<div class="body">` +
            `<div class="head">${p.head}</div>` +
            (msg ? `<div class="msg">${msg}</div>` : "") +
            (a.image && /^https:\/\//.test(a.image)
              ? `<img class="art" src="${esc(a.image)}" alt="${esc(a.title || "")}" />`
              : "") +
            (platLabel ? `<div class="plat">${esc(platLabel)}</div>` : "") +
            `</div>`;
          stage.appendChild(el);
          // Commit the initial style before triggering the entrance transition.
          void el.offsetWidth;
          el.classList.add("in");
          if (SOUND) chime(p.accent);
          setTimeout(() => {
            el.classList.remove("in");
            setTimeout(() => {
              el.remove();
              done();
            }, 480);
          }, DUR);
        }

        let actx = null;
        function chime() {
          try {
            actx =
              actx || new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === "suspended") actx.resume();
            const now = actx.currentTime;
            const notes = [660, 880];
            notes.forEach((f, i) => {
              const o = actx.createOscillator();
              const g = actx.createGain();
              o.type = "triangle";
              o.frequency.value = f;
              const t0 = now + i * 0.12;
              g.gain.setValueAtTime(0.0001, t0);
              g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
              o.connect(g).connect(actx.destination);
              o.start(t0);
              o.stop(t0 + 0.32);
            });
          } catch (_) {
            /* Audio is optional. */
          }
        }

        let ws = null,
          retry = 0,
          alive = true;
        function connect() {
          try {
            ws = new WebSocket(`ws://${location.host}/alerts-ws`);
          } catch (_) {
            return;
          }
          ws.onopen = () => {
            retry = 0;
          };
          ws.onmessage = (ev) => {
            let a;
            try {
              a = JSON.parse(ev.data);
            } catch (_) {
              return;
            }
            enqueue(a);
          };
          ws.onclose = () => {
            if (!alive) return;
            retry = Math.min(retry + 1, 6);
            setTimeout(connect, 400 * retry);
          };
          ws.onerror = () => {
            try {
              ws.close();
            } catch (_) {}
          };
        }
        window.addEventListener("beforeunload", () => {
          alive = false;
          try {
            ws && ws.close();
          } catch (_) {}
        });
        connect();

        if (DEMO) {
          const samples = [
            { kind: "sub", platform: "twitch", user: "joao_gamer" },
            {
              kind: "tip",
              platform: "streamlabs",
              user: "maria",
              amount: 15,
              currency: "BRL",
              message: EN ? "great stream today!" : "arrasou hoje!",
            },
            {
              kind: "raid",
              platform: "twitch",
              user: "canal_amigo",
              amount: 128,
            },
            {
              kind: "subgift",
              platform: "twitch",
              user: "patrocinador",
              amount: 5,
            },
            {
              kind: "superchat",
              platform: "youtube",
              user: "ana",
              amount: 20,
              currency: "BRL",
              message: EN ? "first time here 🎉" : "primeira vez aqui 🎉",
            },
            { kind: "follow", platform: "kick", user: "novato99" },
          ];
          let i = 0;
          setInterval(() => enqueue(samples[i++ % samples.length]), 3200);
        }
      })();
    </script>
  </body>
</html>

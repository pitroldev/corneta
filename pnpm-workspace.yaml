packages:
  - web

allowBuilds:
  # The funding-message postinstall is not needed at runtime.
  core-js: false
  # Installs the platform binary used by the TypeScript runner.
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  # Reviewed pin required for Next.js 16 support.
  - posthog-node@5.47.3

# Remove each security override once its parent resolves a patched version.
overrides:
  "sharp": "0.35.3"
  "postcss": "8.5.25"
  "brace-expansion@^1.0.0": "1.1.18"
  "brace-expansion@^5.0.0": "5.0.9"

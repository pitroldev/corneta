name: Bug
description: Report a reproducible problem with sanitized data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not post tokens, stream keys, full chat, the vault or raw logs. Vulnerabilities must follow [SECURITY.md](https://github.com/pitroldev/corneta/blob/main/SECURITY.md). Portuguese and English are accepted."
  - type: input
    id: version
    attributes:
      label: Corneta version or commit
      placeholder: "0.7.0 / commit; official, Contributor or demo"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows/build, OBS, GPU/driver if relevant. Do not include your computer name or personal paths.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Affected mode
      options:
        - Demo / no streaming
        - Straight up (copy)
        - Smart (hybrid)
        - All out (encode per platform)
        - Not sure / not applicable
  - type: input
    id: destination
    attributes:
      label: Platforms and integration
      description: "E.g.: Twitch/OAuth, custom/URL and key (do not paste the URL or key), reports only."
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal steps to reproduce
      description: Give the identifier of the made-up scenario, if you used one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional, sanitized evidence
      description: A minimal excerpt or screenshot without credentials, usernames or private content. Do not attach the whole stream.

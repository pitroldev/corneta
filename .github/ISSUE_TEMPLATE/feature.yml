name: Enhancement
description: Propose a change with a clear problem and outcome.
title: "[Enhancement]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the streamer's task, not just the technical solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: How will we know it got better? Consider performance, privacy and impact during the stream.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope
      description: What have you already tried? What can be left out of this change?
  - type: markdown
    attributes:
      value: "Read [CONTRIBUTING.md](https://github.com/pitroldev/corneta/blob/main/CONTRIBUTING.md). Proposals are not a commitment to implement them or to a timeline. Do not post private data."

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Fresh releases wait a few days; security updates are not delayed.
    cooldown:
      default-days: 3
    groups:
      frontend-minor:
        update-types: [minor, patch]
        # The telemetry transport adapter supports one exact SDK version; review it in its own PR.
        exclude-patterns: ["posthog-js"]
    ignore:
      # Types must follow the Node 24 runtime pinned by .node-version and engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      rust-minor:
        update-types: [minor, patch]
    ignore:
      # COM bindings must match the version Wry uses; update together with Tauri.
      - dependency-name: webview2-com
      # OAR-OCR pins ort 2.0.0-rc.12; RC 13 removed the execution-provider API it uses.
      - dependency-name: ort
      # Signature tests must use the minisign-verify release that tauri-plugin-updater uses.
      - dependency-name: minisign-verify
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

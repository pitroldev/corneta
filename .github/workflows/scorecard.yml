name: Scorecard

# api.scorecard.dev rejects published results unless the workflow keeps write
# permissions and env out of the top level and this job uses only allowed actions.
on:
  branch_protection_rule:
  schedule:
    - cron: "41 7 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rehearse/publish (e.g. v0.6.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
    permissions:
      contents: read

  release:
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    permissions:
      contents: write
    # Required environment reviewers approve the DPA, published policy, and telemetry payload.
    environment: production-telemetry
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
      assets: ${{ steps.handoff.outputs.assets }}
      installer: ${{ steps.handoff.outputs.installer }}
      signature: ${{ steps.handoff.outputs.signature }}
      artifact_id: ${{ steps.distribution.outputs.artifact-id }}
      telemetry: ${{ steps.telemetry.outputs.configuration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master; immutable implementation
        with:
          toolchain: 1.97.1
      - name: Enable Rust compilation cache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          cache-targets: true

      - name: Validate tag and pin release identity
        id: identity
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          QUALITY_SHA: ${{ needs.quality.outputs.validated_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:REQUESTED_TAG -cne $expectedTag) {
            throw "Invalid tag: expected '$expectedTag', received '$env:REQUESTED_TAG'."
          }

          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[a-f0-9]{40}$') {
            throw "Could not determine the full release SHA."
          }
          if ($env:QUALITY_SHA -notmatch '^[a-f0-9]{40}$' -or $sha -cne $env:QUALITY_SHA) {
            throw 'The tag commit differs from the SHA approved by the quality workflow.'
          }
          $tagCommit = (git rev-parse --verify "refs/tags/$expectedTag^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $sha) {
            throw "HEAD does not match the exact tag $expectedTag."
          }
          git merge-base --is-ancestor $sha "refs/remotes/origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must identify a commit already merged into the default branch.'
          }

          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$expectedTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "RELEASE_TAG=$expectedTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VITE_BUILD_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CORNETA_BUILD_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXT_PUBLIC_BUILD_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: pnpm install --frozen-lockfile

      - name: Review help affected by the release
        shell: pwsh
        run: |
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $previousTag = @(
            git tag --merged $env:RELEASE_SHA --sort=-version:refname --list 'v*' |
              Where-Object { $_ -cne $env:RELEASE_TAG }
          ) | Select-Object -First 1

          if (-not $previousTag) {
            Write-Host 'First versioned release: no previous editorial baseline.'
            exit 0
          }

          pnpm --dir web content:revision:check `
            --base $previousTag `
            --head $env:RELEASE_SHA `
            --product-version $config.version
          if ($LASTEXITCODE -ne 0) {
            throw 'Help affected by the release requires review.'
          }

      - name: Download sidecars (ffmpeg + mediamtx)
        shell: pwsh
        env:
          CORNETA_FFMPEG_MIRROR_URL: ${{ vars.CORNETA_FFMPEG_MIRROR_URL }}
        run: pwsh -File scripts/fetch-binaries.ps1

      - name: Prepare corresponding sources, notices, and license inventory
        shell: pwsh
        run: pnpm compliance:prepare

      - name: Check telemetry privacy and configuration
        id: telemetry
        shell: pwsh
        env:
          VITE_POSTHOG_TOKEN: ${{ vars.POSTHOG_DESKTOP_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_DESKTOP_TOKEN: ${{ vars.POSTHOG_DESKTOP_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          VITE_TELEMETRY_DISABLED: ${{ vars.TELEMETRY_DISABLED || '0' }}
          TELEMETRY_DISABLED: ${{ vars.TELEMETRY_DISABLED || '0' }}
          TELEMETRY_POLICY_PUBLISHED_VERSION: ${{ vars.TELEMETRY_POLICY_PUBLISHED_VERSION }}
          TELEMETRY_DEPLOYMENT_METADATA_URL: https://www.corneta.live/api/v1/health
        run: pnpm telemetry:release:check --wait-for-deployment --github-output

      # The npm installer varies by platform; execute only the pinned, hash-verified CLI.
      - name: Prepare verified PostHog CLI
        if: vars.TELEMETRY_DISABLED != '1'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/fetch-posthog-cli.ps1 -EnvironmentFile $env:GITHUB_ENV

      # Only this step receives the Personal API Key; uploaded maps must be deleted before packaging.
      - name: Build frontend and upload source maps
        if: vars.TELEMETRY_DISABLED != '1'
        shell: pwsh
        env:
          VITE_POSTHOG_TOKEN: ${{ vars.POSTHOG_DESKTOP_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          VITE_SETUP_API_URL: https://www.corneta.live
          VITE_TELEMETRY_DISABLED: ${{ vars.TELEMETRY_DISABLED || '0' }}
          TELEMETRY_DISABLED: ${{ vars.TELEMETRY_DISABLED || '0' }}
          REQUIRE_POSTHOG_SOURCE_MAPS: "1"
        run: |
          if ($env:VITE_TELEMETRY_DISABLED -ne '0' -or $env:TELEMETRY_DISABLED -ne '0') {
            throw 'Vite/Rust kill switches must be 0 for telemetry-enabled builds.'
          }
          if ($env:POSTHOG_API_KEY -notmatch '^phx_[A-Za-z0-9_-]{20,}$') {
            throw 'POSTHOG_API_KEY must be a phx_ Personal API Key dedicated to source maps.'
          }
          if ($env:POSTHOG_PROJECT_ID -notmatch '^\d+$') {
            throw 'POSTHOG_PROJECT_ID must be numeric.'
          }

          try {
            $project = Invoke-RestMethod `
              -Method Get `
              -Uri "https://us.posthog.com/api/projects/$($env:POSTHOG_PROJECT_ID)/" `
              -Headers @{
                Authorization = "Bearer $($env:POSTHOG_API_KEY)"
                Accept = 'application/json'
              } `
              -TimeoutSec 8 `
              -MaximumRedirection 0 `
              -ErrorAction Stop
            if ([string]$project.id -cne $env:POSTHOG_PROJECT_ID -or [string]$project.api_token -cne $env:VITE_POSTHOG_TOKEN) {
              throw 'mismatch'
            }
          } catch {
            throw 'Could not safely validate the PostHog source-map project.'
          }
          pnpm build

      # Emergency builds must not receive source-map credentials.
      - name: Build frontend with telemetry disabled
        if: vars.TELEMETRY_DISABLED == '1'
        shell: pwsh
        env:
          VITE_POSTHOG_TOKEN: ${{ vars.POSTHOG_DESKTOP_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_SETUP_API_URL: https://www.corneta.live
          VITE_TELEMETRY_DISABLED: ${{ vars.TELEMETRY_DISABLED || '0' }}
          TELEMETRY_DISABLED: ${{ vars.TELEMETRY_DISABLED || '0' }}
          REQUIRE_POSTHOG_SOURCE_MAPS: "0"
        run: |
          if ($env:VITE_TELEMETRY_DISABLED -ne '1' -or $env:TELEMETRY_DISABLED -ne '1') {
            throw 'Vite/Rust kill switches must be 1 for emergency builds.'
          }
          pnpm build

      # Preserve the audited frontend by preventing a second Vite build; uploads happen after scanning.
      - name: Build Tauri and sign updater
        shell: pwsh
        env:
          VITE_POSTHOG_TOKEN: ${{ vars.POSTHOG_DESKTOP_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_DESKTOP_TOKEN: ${{ vars.POSTHOG_DESKTOP_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_SETUP_API_URL: https://www.corneta.live
          VITE_TELEMETRY_DISABLED: ${{ vars.TELEMETRY_DISABLED || '0' }}
          TELEMETRY_DISABLED: ${{ vars.TELEMETRY_DISABLED || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node node_modules/@tauri-apps/cli/tauri.js build --config src-tauri/tauri.release.conf.json -- --locked

      - name: Generate updater latest.json
        id: updater
        shell: pwsh
        run: pnpm updater:manifest

      - name: Check Windows signing policy
        shell: pwsh
        env:
          REQUIRE_WINDOWS_CODE_SIGNING: ${{ vars.REQUIRE_WINDOWS_CODE_SIGNING || '0' }}
          INSTALLER_PATH: ${{ steps.updater.outputs.installer_path }}
        run: pwsh -NoProfile -File scripts/check-windows-signature.ps1 -InstallerPath $env:INSTALLER_PATH

      # Scan the exact signed NSIS, including extractable contents, before any release upload.
      - name: Check artifacts before any release upload
        shell: pwsh
        run: pnpm artifacts:check

      - name: Bind the publication handoff to the approved bytes
        id: handoff
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.updater.outputs.installer_path }}
          SIGNATURE_PATH: ${{ steps.updater.outputs.signature_path }}
          MANIFEST_PATH: ${{ steps.updater.outputs.manifest_path }}
          CHECKSUMS_PATH: ${{ steps.updater.outputs.checksums_path }}
          COMPLIANCE_PATH: ${{ steps.updater.outputs.compliance_path }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'corneta-release-handoff'
          New-Item -ItemType Directory -Path $destination -ErrorAction Stop | Out-Null
          $paths = @($env:INSTALLER_PATH, $env:SIGNATURE_PATH, $env:MANIFEST_PATH, $env:CHECKSUMS_PATH, $env:COMPLIANCE_PATH)
          $inventory = @(
            foreach ($path in $paths) {
              $file = Get-Item -LiteralPath $path -ErrorAction Stop
              if ($file.PSIsContainer -or $file.LinkType -or $file.Length -le 0) {
                throw 'Publication requires nonempty regular artifact files.'
              }
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $destination $file.Name) -ErrorAction Stop
              @{ name = $file.Name; size = $file.Length; sha256 = $hash }
            }
          )
          if (($inventory.name | Select-Object -Unique).Count -ne 5) { throw 'Publication requires five distinct assets.' }
          "assets=$($inventory | ConvertTo-Json -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer=$([System.IO.Path]::GetFileName($env:INSTALLER_PATH))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signature=$([System.IO.Path]::GetFileName($env:SIGNATURE_PATH))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or update draft and upload approved artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PATH: ${{ runner.temp }}/corneta-release-handoff/${{ steps.handoff.outputs.installer }}
          SIGNATURE_PATH: ${{ runner.temp }}/corneta-release-handoff/${{ steps.handoff.outputs.signature }}
          MANIFEST_PATH: ${{ runner.temp }}/corneta-release-handoff/latest.json
          CHECKSUMS_PATH: ${{ runner.temp }}/corneta-release-handoff/SHA256SUMS.txt
          COMPLIANCE_PATH: ${{ runner.temp }}/corneta-release-handoff/corneta-third-party.zip
        run: |
          $expectedAssets = @(
            [System.IO.Path]::GetFileName($env:INSTALLER_PATH),
            [System.IO.Path]::GetFileName($env:SIGNATURE_PATH),
            [System.IO.Path]::GetFileName($env:MANIFEST_PATH),
            [System.IO.Path]::GetFileName($env:CHECKSUMS_PATH),
            [System.IO.Path]::GetFileName($env:COMPLIANCE_PATH)
          )
          if (($expectedAssets | Select-Object -Unique).Count -ne 5) {
            throw 'The five approved artifacts must have distinct names.'
          }

          $releaseJson = gh release view $env:RELEASE_TAG --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --verify-tag `
              --draft `
              --title "Corneta $env:RELEASE_TAG" `
              --notes 'Baixe o .exe e confira SHA256SUMS.txt. Este lançamento pode exibir um aviso do SmartScreen: confirme a origem antes de executar. corneta-third-party.zip contém avisos, fontes correspondentes e inventário de licenças. Quem já usa a Corneta recebe o aviso de atualização no app.'
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not create the release draft; no assets will be uploaded.'
            }
          } else {
            try {
              $release = $releaseJson | ConvertFrom-Json -ErrorAction Stop
            } catch {
              throw 'Could not validate the existing draft.'
            }
            if ($release.isDraft -ne $true) {
              throw "Release $env:RELEASE_TAG already exists and is not a draft; automatic upload blocked."
            }
            $unexpectedAssets = @(
              $release.assets |
                ForEach-Object { [string]$_.name } |
                Where-Object { $_ -cnotin $expectedAssets }
            )
            if ($unexpectedAssets.Count -gt 0) {
              throw 'The existing draft contains assets outside the five approved names; review/remove them manually before retrying.'
            }
          }

          gh release upload $env:RELEASE_TAG `
            $env:INSTALLER_PATH `
            $env:SIGNATURE_PATH `
            $env:MANIFEST_PATH `
            $env:CHECKSUMS_PATH `
            $env:COMPLIANCE_PATH `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload approved artifacts.' }

      - name: Preserve only approved distribution files for publication
        id: distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ steps.identity.outputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/corneta-release-handoff/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [quality, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    environment:
      name: production-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}
    # Latest has no compare-and-swap API; serialize promotions across all tags.
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Download the exact artifact from this build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: .artifacts/release-publication
          digest-mismatch: error
      - name: Verify uploaded assets and publish the approved release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          QUALITY_SHA: ${{ needs.quality.outputs.validated_sha }}
          RELEASE_ASSETS_JSON: ${{ needs.release.outputs.assets }}
          RELEASE_TELEMETRY_JSON: ${{ needs.release.outputs.telemetry }}
          INSTALLER_PATH: .artifacts/release-publication/${{ needs.release.outputs.installer }}
          SIGNATURE_PATH: .artifacts/release-publication/${{ needs.release.outputs.signature }}
          MANIFEST_PATH: .artifacts/release-publication/latest.json
          CHECKSUMS_PATH: .artifacts/release-publication/SHA256SUMS.txt
          COMPLIANCE_PATH: .artifacts/release-publication/corneta-third-party.zip
        run: node scripts/promote-release.mjs

name: Distribute release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the latest stable release (false only prepares and validates)
        type: boolean
        default: false
      channel:
        description: Distribution channel
        type: choice
        options: [all, itch, microsoft-store]
        default: all

permissions:
  contents: read

concurrency:
  group: distribution
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: >-
      github.repository == 'pitroldev/corneta' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      installer: ${{ steps.release.outputs.installer }}
    steps:
      - name: Restrict publication to the reviewed default branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo 'Publication must run from main; use publish=false to validate a branch.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - name: Verify the latest published release and updater signature
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/distribution.mjs prepare .artifacts/distribution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distribution-input
          path: |
            .artifacts/distribution/*.exe
            .artifacts/distribution/*.sig
            .artifacts/distribution/*.json
            .artifacts/distribution/*.txt
            .artifacts/distribution/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Explain independent distribution channels
        run: |
          echo 'Scoop and Chocolatey poll the verified upstream release every six hours in their own repositories.' >> "$GITHUB_STEP_SUMMARY"
          echo 'SourceForge already mirrors GitHub releases. Uptodown updates remain editorial.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A successful preparation does not mean that external stores have published the update.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Microsoft Store 0.13.1 was published manually before the Store profile entered the release tags; CI starts with subsequent versions.' >> "$GITHUB_STEP_SUMMARY"

  itch:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.channel != 'microsoft-store'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: distribution-input
          path: .artifacts/distribution
          digest-mismatch: error
      - name: Download pinned butler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/butler .artifacts/itch
          gh release download v15.32.0 --repo itchio/butler --pattern butler-linux-amd64.zip --dir .artifacts/butler
          echo '5db7b053fc9b578b86ffaf3520a12b952eb95c9225171cc5720dfbc9fe4574b3  .artifacts/butler/butler-linux-amd64.zip' | sha256sum --check
          unzip -q .artifacts/butler/butler-linux-amd64.zip -d .artifacts/butler
          chmod +x .artifacts/butler/linux-amd64/butler
      - name: Stage the verified installer
        env:
          INSTALLER: ${{ needs.prepare.outputs.installer }}
        run: cp ".artifacts/distribution/$INSTALLER" .artifacts/itch/
      - name: Publish the Windows installer
        if: github.event_name == 'workflow_run' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -n "$BUTLER_API_KEY" || { echo 'Configure BUTLER_API_KEY to activate itch.io publication.' >&2; exit 1; }
          node scripts/distribution.mjs assert-current .artifacts/distribution
          .artifacts/butler/linux-amd64/butler push .artifacts/itch pitroldev/corneta:windows-installer --userversion "$VERSION"
          .artifacts/butler/linux-amd64/butler status pitroldev/corneta:windows-installer
      - name: Record validation-only execution
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: echo 'itch.io installer staged. No upload was performed.' >> "$GITHUB_STEP_SUMMARY"

  microsoft-store:
    needs: prepare
    if: >-
      needs.prepare.outputs.version != '0.13.1' &&
      (github.event_name != 'workflow_dispatch' || inputs.channel != 'itch')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: source/src-tauri -> ../.artifacts/store/target
      - name: Build and validate the isolated Store edition
        working-directory: source
        shell: pwsh
        env:
          CORNETA_FFMPEG_MIRROR_URL: ${{ vars.CORNETA_FFMPEG_MIRROR_URL }}
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Dependency installation failed.' }
          pwsh -NoProfile -File scripts/fetch-binaries.ps1
          if ($LASTEXITCODE) { throw 'Sidecar preparation failed.' }
          pnpm compliance:prepare
          if ($LASTEXITCODE) { throw 'Compliance preparation failed.' }
          pnpm store:build
          if ($LASTEXITCODE) { throw 'Store build or validation failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: microsoft-store-package
          path: |
            source/.artifacts/store/*.msix
            source/.artifacts/store/package-validation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: distribution-input
          path: .artifacts/distribution
          digest-mismatch: error
      - name: Configure Microsoft Store CLI
        if: github.event_name == 'workflow_run' || inputs.publish
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Submit the verified package to Microsoft Store
        if: github.event_name == 'workflow_run' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          foreach ($name in @('AZURE_AD_TENANT_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'AZURE_AD_APPLICATION_SECRET', 'SELLER_ID')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Configure $name to activate Microsoft Store publication." }
          }
          node automation/scripts/distribution.mjs assert-current .artifacts/distribution
          if ($LASTEXITCODE) { throw 'The release changed after preparation.' }
          $report = Get-Content -Raw source/.artifacts/store/package-validation.json | ConvertFrom-Json
          if ($report.dirty -or $report.baseRevision -cne $env:RELEASE_COMMIT -or $report.version -cne $env:RELEASE_VERSION -or -not $report.semanticValidation -or -not $report.roundTripValidation) {
            throw 'MSIX validation does not match the release commit.'
          }
          $package = (Get-Item -LiteralPath $report.artifact).FullName
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant() -cne $report.sha256) { throw 'MSIX bytes changed after validation.' }
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE) { throw 'Microsoft Store authentication failed.' }
          msstore publish $package -id 9P1Q28Q6Q6TD
          if ($LASTEXITCODE) { throw 'Microsoft Store submission failed; inspect Partner Center before retrying.' }
          'MSIX submitted. Microsoft certification and public availability are separate.' >> $env:GITHUB_STEP_SUMMARY

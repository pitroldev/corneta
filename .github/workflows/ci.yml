name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Ref exato que todos os jobs devem validar"
        required: false
        type: string
    outputs:
      validated_sha:
        description: "SHA completo validado por todos os jobs"
        value: ${{ jobs.resolve.outputs.sha }}

permissions:
  contents: read

# A called workflow sees the caller's github.workflow. Prefix the group so a
# release never cancels itself; explicit release refs are never superseded here.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.checkout_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.checkout_ref && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
      - id: revision
        name: Fixar commit validado
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Não foi possível fixar o SHA completo do CI.' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  secrets:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      # Mesmo scanner/checksum e escopo local: TODAS as refs + snapshot atual.
      # Não publica SARIF/logs brutos nem usa secrets em PRs de forks.
      - name: Testar exceções estritas de fixtures
        run: node --test scripts/audit-secrets.check.mjs
      - name: Auditar histórico completo e arquivos publicáveis
        run: node scripts/audit-secrets.mjs

  frontend:
    needs: [resolve, browser-smoke]
    # Preserve the existing required frontend check: skipped dependencies must
    # fail this job, not turn it into a successful-looking skipped check.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TELEMETRY_DISABLED: "1"
      VITE_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Exigir commit resolvido e smoke aprovado
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
        run: |
          if [[ "$RESOLVE_RESULT" != success || "$BROWSER_RESULT" != success ]]; then
            echo 'A resolução do commit e o smoke do navegador devem passar.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verificar revisões dos artigos alterados
        if: github.event_name == 'pull_request'
        run: >-
          pnpm --dir web content:revision:check --
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ needs.resolve.outputs.sha }}"
      - run: pnpm lint
      - run: pnpm format:check
      - name: Verificar links locais da documentação
        run: node scripts/check-doc-links.mjs
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle:check
      - name: Verificar scripts de release/segredos
        run: node scripts/check-scripts.mjs
      - name: Verificar site e setup API
        env:
          NEXT_PUBLIC_SITE_URL: https://www.corneta.live
          NEXT_PUBLIC_PRIMARY_CTA_URL: https://example.com/corneta-download
        run: pnpm web:check
      - name: Impedir alteração incidental dos lockfiles
        run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock

  browser-smoke:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      TELEMETRY_DISABLED: "1"
      VITE_TELEMETRY_DISABLED: "1"
      CORNETA_CONTRIBUTOR: "1"
      VITE_CONTRIBUTOR: "1"
      CORNETA_SMOKE_OUTPUT_DIR: .artifacts/browser-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compilar a demo sem credenciais ou perfil do aplicativo
        run: node scripts/contributor.mjs frontend:build
      - name: Smoke de relatórios em Chromium real e perfil descartável
        timeout-minutes: 3
        shell: pwsh
        run: |
          foreach ($locale in @('pt-BR', 'en')) {
            $env:CORNETA_SMOKE_LOCALE = $locale
            node scripts/smoke-reports.mjs
            if ($LASTEXITCODE -ne 0) { throw "Smoke do browser falhou para $locale." }
          }
      - name: Preservar somente diagnóstico sintético do smoke
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-smoke
          path: .artifacts/browser-smoke/
          if-no-files-found: warn
          retention-days: 7

  rust:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      # Mesmo toolchain estável e exato usado na release. Mantê-lo fixo aqui
      # impede que `rust-version` vire apenas documentação não testada.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master; immutable implementation
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Ativar cache de compilação Rust
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          cache-targets: true
      # Os jobs não compartilham disco. Há testes de mídia não-ignorados aqui.
      - name: Preparar sidecars verificados para os testes Rust
        shell: pwsh
        env:
          CORNETA_FFMPEG_MIRROR_URL: ${{ vars.CORNETA_FFMPEG_MIRROR_URL }}
        run: pwsh -NoProfile -File ../scripts/fetch-binaries.ps1

      - run: pwsh -NoProfile -File ../scripts/check-powershell.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - run: cargo audit
      - run: cargo deny --locked --config ../deny.toml check
      - run: git diff --exit-code -- Cargo.lock ../pnpm-lock.yaml

  media-integration:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master; immutable implementation
        with:
          toolchain: 1.97.1
      - name: Ativar cache de compilação Rust
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          cache-targets: true
      - name: Preparar exatamente o FFmpeg verificado da release
        shell: pwsh
        env:
          CORNETA_FFMPEG_MIRROR_URL: ${{ vars.CORNETA_FFMPEG_MIRROR_URL }}
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'corneta-media-tools'
          pwsh -NoProfile -File ../scripts/fetch-binaries.ps1 -ToolDirectory $toolDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar mídia verificada.' }
          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $toolDirectory 'ffmpeg.exe') -version
          & (Join-Path $toolDirectory 'ffprobe.exe') -version
      - run: cargo test --locked --lib -- --ignored --test-threads=1
      - run: git diff --exit-code -- Cargo.lock ../pnpm-lock.yaml

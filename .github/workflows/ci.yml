name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Ref exato que todos os jobs devem validar"
        required: false
        type: string
    outputs:
      validated_sha:
        description: "SHA completo validado por todos os jobs"
        value: ${{ jobs.resolve.outputs.sha }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
      - id: revision
        name: Fixar commit validado
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Não foi possível fixar o SHA completo do CI.' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  secrets:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Sem esta variável, a versão do binário é decidida pelo action.
          GITLEAKS_VERSION: 8.30.1

  frontend:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verificar revisões dos artigos alterados
        if: github.event_name == 'pull_request'
        run: >-
          pnpm --dir web content:revision:check --
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ needs.resolve.outputs.sha }}"
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle:check
      - name: Verificar scripts de release/segredos
        run: node --check scripts/check-bundle.mjs && node --check scripts/check-telemetry-release.mjs && node --check scripts/create-updater-manifest.mjs
      - name: Verificar site e setup API
        env:
          NEXT_PUBLIC_SITE_URL: https://www.corneta.live
          NEXT_PUBLIC_PRIMARY_CTA_URL: https://example.com/corneta-download
        run: pnpm web:check

  rust:
    needs: resolve
    runs-on: windows-2025
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      # Mesmo toolchain estável e exato usado na release. Mantê-lo fixo aqui
      # impede que `rust-version` vire apenas documentação não testada.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - run: cargo audit
      - run: cargo deny --config ../deny.toml check

  media-integration:
    needs: resolve
    runs-on: windows-2025
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
      - name: Preparar exatamente o FFmpeg verificado da release
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'corneta-media-tools'
          pwsh -NoProfile -File ../scripts/fetch-binaries.ps1 -ToolDirectory $toolDirectory
          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $toolDirectory 'ffmpeg.exe') -version
          & (Join-Path $toolDirectory 'ffprobe.exe') -version
      - run: cargo test --lib -- --ignored --test-threads=1

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Exact ref all jobs must validate"
        required: false
        type: string
    outputs:
      validated_sha:
        description: "Full SHA validated by all jobs"
        value: ${{ jobs.resolve.outputs.sha }}

permissions:
  contents: read

# A called workflow sees the caller's github.workflow. Prefix the group so a
# release never cancels itself; explicit release refs are never superseded here.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.checkout_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.checkout_ref && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
      - id: revision
        name: Pin the validated commit
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Could not pin the full CI commit SHA.' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  secrets:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      # Keep the local scanner's full-ref scope; never upload raw findings or expose secrets to forks.
      - name: Test strict fixture exceptions
        run: node --test scripts/audit-secrets.check.mjs
      - name: Audit full history and publishable files
        run: node scripts/audit-secrets.mjs

  frontend:
    needs: [resolve, browser-smoke]
    # Preserve the existing required frontend check: skipped dependencies must
    # fail this job, not turn it into a successful-looking skipped check.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TELEMETRY_DISABLED: "1"
      VITE_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Require resolved commit and passing smoke tests
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
        run: |
          if [[ "$RESOLVE_RESULT" != success || "$BROWSER_RESULT" != success ]]; then
            echo 'Commit resolution and browser smoke tests must pass.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed article reviews
        if: github.event_name == 'pull_request'
        run: >-
          pnpm --dir web content:revision:check
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ needs.resolve.outputs.sha }}"
      - run: pnpm lint
      - run: pnpm format:check
      - name: Check local documentation links
        run: node scripts/check-doc-links.mjs
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle:check
      - name: Check release and secret-scanning scripts
        run: node scripts/check-scripts.mjs
      - name: Check website and Setup API
        env:
          NEXT_PUBLIC_SITE_URL: https://www.corneta.live
          NEXT_PUBLIC_PRIMARY_CTA_URL: https://example.com/corneta-download
        run: pnpm web:check
      - name: Prevent incidental lockfile changes
        run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock

  browser-smoke:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      TELEMETRY_DISABLED: "1"
      VITE_TELEMETRY_DISABLED: "1"
      CORNETA_CONTRIBUTOR: "1"
      VITE_CONTRIBUTOR: "1"
      CORNETA_SMOKE_OUTPUT_DIR: .artifacts/browser-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the demo without credentials or application profile
        run: node scripts/contributor.mjs frontend:build
      - name: Smoke-test reports in real Chromium with a disposable profile
        timeout-minutes: 3
        shell: pwsh
        run: |
          foreach ($locale in @('pt-BR', 'en')) {
            $env:CORNETA_SMOKE_LOCALE = $locale
            node scripts/smoke-reports.mjs
            if ($LASTEXITCODE -ne 0) { throw "Browser smoke test failed for $locale." }
          }
      - name: Preserve only synthetic smoke diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-smoke
          path: .artifacts/browser-smoke/
          if-no-files-found: warn
          retention-days: 7

  rust:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      # Test the exact release toolchain so rust-version remains an enforced contract.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master; immutable implementation
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Enable Rust compilation cache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          cache-targets: true
      # Jobs do not share sidecars, and non-ignored Rust tests require media tools.
      - name: Prepare verified sidecars for Rust tests
        shell: pwsh
        env:
          CORNETA_FFMPEG_MIRROR_URL: ${{ vars.CORNETA_FFMPEG_MIRROR_URL }}
        run: pwsh -NoProfile -File ../scripts/fetch-binaries.ps1

      - run: pwsh -NoProfile -File ../scripts/check-powershell.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - run: cargo audit
      - run: cargo deny --locked --config ../deny.toml check
      - run: git diff --exit-code -- Cargo.lock ../pnpm-lock.yaml

  media-integration:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master; immutable implementation
        with:
          toolchain: 1.97.1
      - name: Enable Rust compilation cache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          cache-targets: true
      - name: Prepare the exact verified release FFmpeg
        shell: pwsh
        env:
          CORNETA_FFMPEG_MIRROR_URL: ${{ vars.CORNETA_FFMPEG_MIRROR_URL }}
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'corneta-media-tools'
          pwsh -NoProfile -File ../scripts/fetch-binaries.ps1 -ToolDirectory $toolDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare verified media tools.' }
          $toolDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $toolDirectory 'ffmpeg.exe') -version
          & (Join-Path $toolDirectory 'ffprobe.exe') -version
      - run: cargo test --locked --lib -- --ignored --test-threads=1
      - run: git diff --exit-code -- Cargo.lock ../pnpm-lock.yaml
